<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found | Omar Ehab</title>
<meta name="description" content="That page doesn't exist. Head back to Omar Ehab's portfolio.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://omarehab.net/">
<meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">

<script>
(function(){try{var s=localStorage.getItem('theme');var d=s||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',d);}catch(e){}})();
</script>

<style>
@font-face{font-family:'Poppins';src:url('/assets/fonts/poppins-regular.v2.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Poppins';src:url('/assets/fonts/poppins-semibold.v2.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}

:root{
  --accent:#6366f1;--accent-strong:#818cf8;
  --radius:16px;--radius-sm:10px;
  --font:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  --t:.28s cubic-bezier(.4,0,.2,1);
}
html[data-theme="dark"]{
  --bg:#0b0d10;--surface:#14181f;
  --text:#e8ebf0;--heading:#f5f7fa;--muted:#9aa5b6;
  --border:rgba(255,255,255,.09);--border-strong:rgba(255,255,255,.16);
  --btn-bg:#818cf8;--btn-fg:#0b0d10;
  --shadow:0 16px 40px -18px rgba(0,0,0,.8);
}
html[data-theme="light"]{
  --bg:#f5f6f9;--surface:#ffffff;
  --text:#2c3340;--heading:#0c1020;--muted:#545d6b;
  --border:rgba(12,16,32,.10);--border-strong:rgba(12,16,32,.20);
  --accent:#4f46e5;--accent-strong:#4338ca;
  --btn-bg:#4f46e5;--btn-fg:#ffffff;
  --shadow:0 18px 40px -22px rgba(20,30,80,.18);
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.001ms!important}}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  line-height:1.65;font-size:16px;min-height:100vh;
  display:grid;place-items:center;padding:1.5rem;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
main{max-width:34rem;text-align:center}
.code{
  display:inline-block;font-size:.78rem;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent-strong);background:var(--surface);
  border:1px solid var(--border);border-radius:50px;padding:.4rem .95rem;margin-bottom:1.4rem;
}
h1{
  font-size:clamp(1.9rem,5vw,2.7rem);font-weight:600;color:var(--heading);
  line-height:1.18;letter-spacing:-.02em;margin-bottom:.8rem;
}
p{color:var(--muted);margin-bottom:2rem}
.actions{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center}
a{
  display:inline-flex;align-items:center;gap:.5rem;font-weight:600;font-size:.95rem;
  padding:.85rem 1.4rem;border-radius:var(--radius-sm);text-decoration:none;
  transition:var(--t);
}
.primary{background:var(--btn-bg);color:var(--btn-fg);box-shadow:0 8px 22px -8px var(--accent)}
.ghost{color:var(--heading);border:1px solid var(--border-strong);background:var(--surface)}
a:hover{transform:translateY(-2px)}
a:focus-visible{outline:2px solid var(--accent-strong);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="code">Error 404</p>
  <h1>This page doesn't exist</h1>
  <p>The link may be broken, or the page may have moved. Everything lives on the one page, so try starting from the top.</p>
  <div class="actions">
    <a class="primary" href="/">Back to home</a>
    <a class="ghost" href="/#contact">Get in touch</a>
  </div>
</main>
</body>
</html>
