# ============================================================
# Netlify configuration — omarehab.net
# Netlify already provides: HTTPS, HTTP/2+3, global CDN, and
# automatic brotli/gzip compression. This file adds caching
# rules and security headers.
# ============================================================

[build]
  # The site is static and lives at the repo root — no build step.
  publish = "."

# ---------------- Caching ----------------
# Rules are applied top→bottom; later, more-specific rules win on conflicts.

# Default for all assets: cache 1 day, then serve stale while revalidating.
# (Filenames aren't fingerprinted, so we avoid "immutable" here — that way an
#  updated image/script reaches returning visitors within a day, not a year.)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=2592000"

# Fonts genuinely never change → safe to cache hard and skip revalidation.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML must always revalidate so content edits go live immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------------- Security headers (all responses) ----------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), browsing-topics=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# ---------------- Content-Security-Policy ----------------
# Strict same-origin CSP. 'unsafe-inline' is required for the inlined <style>
# and the anti-FOUC inline <script>; form-action allows the contact form to POST.
# After deploy, check the browser console for any CSP violation reports.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'; upgrade-insecure-requests"
